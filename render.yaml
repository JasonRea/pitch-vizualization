services:
  - type: web
    name: pitch-viz-api
    env: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: DO_SPACES_REGION
        sync: false
      - key: DO_SPACES_BUCKET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
